# Version: 2026-07-28
# This is an organization workflow, it should not be edited!
# The original source is in the baltech-ag/ci-scripts repository in the templates folder
# https://baltech-wiki.atlassian.net/wiki/spaces/THIR/pages/257785857/GitHub#GitHub-Workflows-f%C3%BCr-Releasemanagement-einrichten
name: Release Actions
on:
  push:
  pull_request:
    branches:
      - 'master'
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9][0-9][0-9][0-9]-[0-9]+.[0-9]+'
    types:
      - 'opened'
      - 'ready_for_review'
      - 'closed'
  create:
jobs:
  release-actions:
    uses: baltech-ag/ci-scripts/.github/workflows/release-actions.yml@master
    secrets: inherit
  deploy-build:
    needs: [release-actions]
    # Deploy on every push except the push of the [release] commit to a
    # version branch or master: the tag push that follows seconds later runs
    # the authoritative release deploy, so this deploy would build the same
    # commit twice in development mode. For MobileIDApp this even failed
    # reproducibly, because both development deploys of the [release] commit
    # (release-* branch and version branch) submitted the same temporarily
    # bumped version to the TestFlight beta review, which Apple rejects while
    # the first review is still pending. Pushes of the [release] commit to
    # release-* branches keep deploying, as they are the PR checks that gate
    # the auto-merge.
    if: >-
      github.event_name == 'push' &&
      (github.ref_type == 'tag' ||
      startsWith(github.ref_name, 'release-') ||
      !startsWith(github.event.head_commit.message, '[release]'))
    uses: ./.github/workflows/repo-release-actions-deploy.yml
    with:
      release-stage: ${{ needs.release-actions.outputs.release-stage }}
      deploy-mode: ${{ needs.release-actions.outputs.deploy-mode }}
      project-name: ${{ needs.release-actions.outputs.project-name }}
      sub-project-id: ${{ needs.release-actions.outputs.sub-project-id }}
      version: ${{ needs.release-actions.outputs.version }}
      version-file: ${{ needs.release-actions.outputs.version-file }}
    secrets: inherit
